<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake Game Pro - Web Edition</title>
  <style>
    /* ==========================================================================
       1. STYLES & LAYOUT (CSS)
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .game-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      color: #38bdf8;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    /* Board Statistik */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background-color: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #334155;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: #38bdf8;
    }

    /* Area Game (Canvas) */
    .canvas-wrapper {
      position: relative;
      margin-bottom: 15px;
    }

    canvas {
      background-color: #020617;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      max-width: 100%;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
    }

    /* Tombol Utama */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: #7dd3fc;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
      transform: none;
    }

    /* Kontrol Virtual (HP / Touch) */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 200px;
      margin: 0 auto;
    }

    .d-btn {
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 14px;
      font-size: 1.2rem;
      border-radius: 8px;
    }

    .d-btn:active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    .empty-slot {
      visibility: hidden;
    }

    .instructions {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>SNAKE GAME PRO</h1>

    <div class="dashboard">
      <div class="stat-box">
        <span class="stat-label">Skor</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Level</span>
        <span class="stat-value" id="level">1</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Tertinggi</span>
        <span class="stat-value" id="high-score">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="btn-group">
      <button id="start-btn">Mulai Game</button>
      <button id="pause-btn" disabled>Pause</button>
    </div>

    <div class="d-pad">
      <div class="empty-slot"></div>
      <button class="d-btn" id="btn-up">▲</button>
      <div class="empty-slot"></div>
      <button class="d-btn" id="btn-left">◄</button>
      <button class="d-btn" id="btn-down">▼</button>
      <button class="d-btn" id="btn-right">►</button>
    </div>

    <p class="instructions">Gunakan Keyboard (Panah) atau Tombol di layar.</p>
  </div>

  <script>
    // Konfigurasi Elemen DOM
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const levelEl = document.getElementById("level");
    const highScoreEl = document.getElementById("high-score");
    const startBtn = document.getElementById("start-btn");
    const pauseBtn = document.getElementById("pause-btn");

    // Parameter Grid Canvas
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // State Game
    let snake = [];
    let food = { x: 0, y: 0 };
    let dx = gridSize;
    let dy = 0;
    let score = 0;
    let level = 1;
    let speed = 120;
    let highScore = localStorage.getItem("snakeProHighScore") || 0;
    let gameInterval = null;
    let isGameRunning = false;
    let isPaused = false;

    highScoreEl.textContent = highScore;

    // Sound Synthesizer (Audio Efek Sederhana Tanpa File Luar)
    function playBeep(freq, type = "sine", duration = 0.1) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Mengabaikan error browser policy jika belum ada interaksi pengguna
      }
    }

    // Inisialisasi Ulang Variabel Game
    function initGame() {
      snake = [
        { x: 160, y: 200 },
        { x: 140, y: 200 },
        { x: 120, y: 200 }
      ];
      dx = gridSize;
      dy = 0;
      score = 0;
      level = 1;
      speed = 120;
      scoreEl.textContent = score;
      levelEl.textContent = level;
      generateFood();
    }

    // Penjanaan Makanan Acak
    function generateFood() {
      food.x = Math.floor(Math.random() * tileCount) * gridSize;
      food.y = Math.floor(Math.random() * tileCount) * gridSize;
      
      // Mencegah makanan berlokasi di dalam badan ular
      snake.forEach(segment => {
        if (segment.x === food.x && segment.y === food.y) {
          generateFood();
        }
      });
    }

    // Loop Utama Game
    function gameLoop() {
      if (isPaused) return;

      if (checkCollision()) {
        handleGameOver();
        return;
      }

      clearCanvas();
      drawFood();
      moveSnake();
      drawSnake();
    }

    // Membersihkan Layar Canvas
    function clearCanvas() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Render Ular
    function drawSnake() {
      snake.forEach((part, index) => {
        // Kepala berwarna hijau cerah, badan hijau standar
        ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(part.x, part.y, gridSize - 2, gridSize - 2);
      });
    }

    // Pergerakan Ular & Deteksi Makan
    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head);

      // Cek Makan
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playBeep(600, "square", 0.08);

        // Update High Score
        if (score > highScore) {
          highScore = score;
          highScoreEl.textContent = highScore;
          localStorage.setItem("snakeProHighScore", highScore);
        }

        // Naikkan Level tiap kelipatan 50 skor
        if (score % 50 === 0) {
          level++;
          levelEl.textContent = level;
          speed = Math.max(50, speed - 15); // Naikkan kecepatan game
          clearInterval(gameInterval);
          gameInterval = setInterval(gameLoop, speed);
          playBeep(880, "triangle", 0.2);
        }

        generateFood();
      } else {
        snake.pop();
      }
    }

    // Render Makanan
    function drawFood() {
      ctx.fillStyle = "#f43f5e";
      ctx.fillRect(food.x, food.y, gridSize - 2, gridSize - 2);
    }

    // Cek Tabrakan Dinding & Badan
    function checkCollision() {
      const head = snake[0];

      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        return true;
      }

      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) return true;
      }

      return false;
    }

    // Kontrol Arah Pergerakan
    function setDirection(newDx, newDy) {
      if (!isGameRunning || isPaused) return;

      const goingUp = dy === -gridSize;
      const goingDown = dy === gridSize;
      const goingRight = dx === gridSize;
      const goingLeft = dx === -gridSize;

      if (newDx === -gridSize && !goingRight) { dx = -gridSize; dy = 0; }
      if (newDx === gridSize && !goingLeft) { dx = gridSize; dy = 0; }
      if (newDy === -gridSize && !goingDown) { dx = 0; dy = -gridSize; }
      if (newDy === gridSize && !goingUp) { dx = 0; dy = gridSize; }
    }

    // Event Listener Keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") setDirection(-gridSize, 0);
      if (e.key === "ArrowUp") setDirection(0, -gridSize);
      if (e.key === "ArrowRight") setDirection(gridSize, 0);
      if (e.key === "ArrowDown") setDirection(0, gridSize);
      if (e.key === " ") togglePause(); // Spasi untuk Pause
    });

    // Event Listener Tombol D-Pad Mobile
    document.getElementById("btn-up").addEventListener("click", () => setDirection(0, -gridSize));
    document.getElementById("btn-down").addEventListener("click", () => setDirection(0, gridSize));
    document.getElementById("btn-left").addEventListener("click", () => setDirection(-gridSize, 0));
    document.getElementById("btn-right").addEventListener("click", () => setDirection(gridSize, 0));

    // Kontrol Start / Restart
    startBtn.addEventListener("click", () => {
      if (isGameRunning) clearInterval(gameInterval);
      initGame();
      isGameRunning = true;
      isPaused = false;
      pauseBtn.disabled = false;
      pauseBtn.textContent = "Pause";
      startBtn.textContent = "Restart Game";
      gameInterval = setInterval(gameLoop, speed);
    });

    // Kontrol Pause
    function togglePause() {
      if (!isGameRunning) return;
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? "Lanjut" : "Pause";
    }

    pauseBtn.addEventListener("click", togglePause);

    // Kematian Ular
    function handleGameOver() {
      playBeep(150, "sawtooth", 0.3);
      clearInterval(gameInterval);
      isGameRunning = false;
      pauseBtn.disabled = true;
      startBtn.textContent = "Main Lagi";
      
      // Render Teks Game Over pada Canvas
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f43f5e";
      ctx.font = "bold 28px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = "#f8fafc";
      ctx.font = "16px sans-serif";
      ctx.fillText(`Skor Akhir: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
    }

    // Tampilan Awal Canvas
    clearCanvas();
    ctx.fillStyle = "#38bdf8";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("Klik 'Mulai Game' untuk bermain", canvas.width / 2, canvas.height / 2);
  </script>
</body>
</html>
