<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Game - Mobil Balap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏎️ RACING GAME 🏎️</h1>
            <div class="info-panel">
                <div class="score-board">
                    <div class="score-item">
                        <span class="label">Score:</span>
                        <span class="value" id="score">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Kecepatan:</span>
                        <span class="value" id="speed">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">Nyawa:</span>
                        <span class="value" id="lives">3</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="game-area">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div class="instructions">
                <h3>Kontrol:</h3>
                <p>⬅️ A - Gerak Kiri</p>
                <p>➡️ D - Gerak Kanan</p>
                <p>⬆️ W - Percepat</p>
                <p>⬇️ S - Rem</p>
                <p>SPACE - Mulai/Pause</p>
            </div>
        </div>

        <div class="game-status" id="gameStatus">
            <button id="startBtn" class="btn-start">Mulai Game</button>
            <button id="restartBtn" class="btn-restart" style="display:none;">Main Lagi</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
